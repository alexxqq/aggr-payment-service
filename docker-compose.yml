services:
  payment-service:
    build: .
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://payment:password@postgres:5432/payment_service_db
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-secret}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8000}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_service_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
